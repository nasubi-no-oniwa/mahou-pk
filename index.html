<!doctype html>
<html lang="ja">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f2e24">
<meta name="description" content="線を描けば、それが魔球になる。合言葉で魔球をけり合うPKゲーム。">
<meta property="og:title" content="魔法の球 PK">
<meta property="og:description" content="線を描けば、それが魔球になる。止められるものなら止めてみろ。">
<meta property="og:image" content="https://nasubi-no-oniwa.github.io/mahou-pk/ogp.png">
<meta name="twitter:card" content="summary_large_image">
<title>魔法の球 PK</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
/* 昼のスタジアム。スコアボードの深緑に、魔球の桃色 */
:root{
  --board:#0f2e24;
  --board2:#18412f;
  --cream:#f6f0dc;
  --magic:#ff3fa4;
  --gold:#ffd23f;
  --ink:#0b1f18;
  --red:#e2402c;
  --disp:"Dela Gothic One","Hiragino Sans","Noto Sans JP",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;background:#9fc4dd;color:var(--cream);overflow:hidden;font-family:var(--body);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
html,body,button,input,#app,.overlay,.card,#top,#views,.bar{touch-action:manipulation}
html,body{-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior:none}
[hidden]{display:none!important}
#app{position:fixed;inset:0}
#c{width:100%;height:100%;display:block;touch-action:none}
#draw{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
button{font-family:var(--body)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* 上の帯 */
#top{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;display:flex;align-items:flex-start;gap:8px;pointer-events:none}
#top>*{pointer-events:auto}
.chip{white-space:nowrap;background:rgba(15,46,36,.88);color:var(--cream);border-radius:10px;padding:6px 11px;font-weight:900;font-size:13px;border:0;line-height:1.25}
button.chip{cursor:pointer}
#batInfo{margin-left:auto;text-align:right;max-width:62%}
#batInfo .nm{display:block;font-family:var(--disp);font-weight:400;font-size:15px;color:var(--gold);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#batInfo .cnt{white-space:nowrap;display:flex;gap:6px;justify-content:flex-end;align-items:center;margin-top:3px;font-size:12px}
.dots{display:inline-flex;gap:4px}
.dots i{width:13px;height:13px;border-radius:50%;background:rgba(246,240,220,.25);display:block}
.dots i.on{background:var(--gold);box-shadow:0 0 6px var(--gold)}
#inkBox{margin-left:auto;min-width:150px}
#inkBox span{display:block;font-size:11px;opacity:.85}
#ink{height:10px;border-radius:5px;background:rgba(246,240,220,.2);overflow:hidden;margin-top:4px}
#inkFill{height:100%;width:100%;background:linear-gradient(90deg,var(--magic),var(--gold));transition:width .08s}
#ink.low #inkFill{background:linear-gradient(90deg,var(--red),#ff9a3c)}
#ink.out #inkFill{background:var(--red)}

/* 中央の大きい文字 */
#msg{position:absolute;left:0;right:0;top:34%;text-align:center;pointer-events:none;padding:0 16px}
#msgBig{font-family:var(--disp);font-size:clamp(38px,12vw,64px);line-height:1.05;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink),0 0 24px rgba(0,0,0,.35)}
#msgBig.good{color:var(--gold)}
#msgBig.magic{color:var(--magic)}
#msgSub{margin-top:10px;font-weight:900;font-size:15px;color:#fff;text-shadow:0 1px 3px #000,0 0 10px rgba(0,0,0,.7)}
#hint{word-break:auto-phrase;position:absolute;left:50%;transform:translateX(-50%);width:max-content;max-width:min(92%,440px);background:rgba(15,46,36,.82);border-radius:12px;padding:6px 12px;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);text-align:center;font-weight:900;font-size:14px;color:#fff;text-shadow:0 1px 3px #000,0 0 10px rgba(0,0,0,.7);pointer-events:none;text-wrap:balance}
#hint.err{color:#ffd0d0}
#hint.top{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 104px)}
#views{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 58px);display:flex;gap:4px;background:rgba(15,46,36,.88);padding:4px;border-radius:999px}
#views button{font:900 13px var(--body);border:0;background:transparent;color:var(--cream);border-radius:999px;padding:7px 12px;cursor:pointer;white-space:nowrap}
#views button[aria-pressed="true"]{background:var(--gold);color:var(--ink)}
#tutSkip{position:absolute;right:12px;top:calc(env(safe-area-inset-top,0px) + 136px)}

/* 下のボタン帯 */
.bar{position:absolute;left:0;right:0;bottom:0;padding:0 12px calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;gap:8px;justify-content:center}
.bar button{flex:1;max-width:160px;font-weight:900;font-size:15px;border:0;border-radius:12px;padding:13px 6px;cursor:pointer;background:rgba(15,46,36,.92);color:var(--cream);box-shadow:0 3px 0 rgba(0,0,0,.35)}
.bar button.go{background:var(--magic);color:#fff;box-shadow:0 3px 0 #8f1457}
.bar button:disabled{opacity:.45;cursor:default}

/* カード */
.overlay{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1fr);place-items:safe center;background:rgba(6,20,15,.45);padding:calc(env(safe-area-inset-top,0px) + 18px) 16px calc(env(safe-area-inset-bottom,0px) + 18px);overflow-y:auto}
.card{position:relative;width:min(100%,380px);background:var(--board);border-radius:14px;padding:24px 20px 18px;text-align:center;box-shadow:0 0 0 4px var(--board2),0 0 0 6px var(--cream),0 20px 44px rgba(0,0,0,.45)}
.card h1{font-family:var(--disp);font-weight:400;font-size:clamp(40px,13vw,54px);line-height:1;margin:6px 0 0;color:var(--cream);letter-spacing:.02em}
.card h1 .tama{color:var(--magic);text-shadow:0 0 18px rgba(255,63,164,.6)}
.card h1 .pk{display:inline-block;margin-left:.15em;font-size:.62em;vertical-align:.35em;background:var(--gold);color:var(--ink);border-radius:10px;padding:.02em .22em .08em;transform:rotate(-6deg)}
.ruby{font-weight:900;font-size:12px;letter-spacing:.3em;color:var(--gold);margin:0}
.sub{font-weight:900;font-size:15px;margin:12px 0 0}
.card h2{font-family:var(--disp);font-weight:400;font-size:24px;margin:0;color:var(--gold);line-height:1.25}
.big{display:block;width:100%;margin-top:12px;font-family:var(--disp);font-size:clamp(17px,5.4vw,21px);background:var(--magic);color:#fff;border:0;border-radius:12px;padding:12px 14px 13px;cursor:pointer;box-shadow:0 4px 0 #8f1457;letter-spacing:.03em;white-space:nowrap}
.big small{display:block;font-family:var(--body);font-weight:900;font-size:12px;opacity:.9;margin-top:2px;letter-spacing:0}
.big.gold{background:var(--gold);color:var(--ink);box-shadow:0 4px 0 #a07d0e}
.big.alt{background:transparent;color:var(--cream);border:2px solid rgba(246,240,220,.6);box-shadow:none;font-size:16px;padding:9px}
.big.x{background:#000;color:#fff;box-shadow:0 4px 0 #444;font-size:17px}
.big:disabled{opacity:.5;cursor:default}
.row2{display:flex;gap:8px}.row2 .big{flex:1}
.langs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:16px}
.langs button{font:700 13px var(--body);background:transparent;color:var(--cream);border:1.5px solid rgba(246,240,220,.45);border-radius:999px;padding:4px 11px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--cream);color:var(--board);border-color:var(--cream)}
.field{display:flex;gap:8px;margin-top:14px}
.field input{flex:1;min-width:0;font:700 17px var(--body);padding:11px 12px;border-radius:10px;border:2px solid var(--cream);background:#fffaf0;color:var(--ink);-webkit-user-select:text;user-select:text}
.field input.code{font-family:var(--disp);font-weight:400;letter-spacing:.18em;text-transform:uppercase;text-align:center;font-size:22px}
.note{margin:10px 0 0;font-weight:700;font-size:13px;opacity:.9;min-height:1.2em}
.note.err{color:#ffb3b3;opacity:1}
.codebox{margin:14px 0 0;background:var(--cream);color:var(--ink);border-radius:12px;padding:10px 8px 12px}
.codebox span{display:block;font-weight:900;font-size:12px;opacity:.7}
.codebox b{display:block;font-family:var(--disp);font-weight:400;font-size:clamp(30px,10vw,40px);letter-spacing:.14em;line-height:1.2}
.chal{margin:0 0 4px;font-weight:900;font-size:13px;color:var(--gold)}
.bname{font-family:var(--disp);font-size:clamp(24px,8vw,32px);color:#fff;margin:4px 0 0;line-height:1.2;word-break:break-all}
.stats{display:flex;justify-content:center;gap:8px;margin-top:12px}
.stats div{background:var(--board2);border-radius:10px;padding:6px 10px;min-width:82px}
.stats span{display:block;font-size:11px;font-weight:700;opacity:.8}
.stats b{display:block;font-family:var(--disp);font-weight:400;font-size:20px;color:var(--gold)}
.how{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:6px;text-align:left;font-weight:700;font-size:13.5px}
.how li{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start}
.how li b{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--magic);color:#fff;font-size:11px}
.res-big{font-family:var(--disp);font-size:clamp(40px,13vw,56px);line-height:1.05;margin:0}
.res-big.win{color:var(--gold)}
.res-big.lose{color:#c9d6d0}
.tabs{display:flex;gap:4px;justify-content:center;margin-top:12px}
.tabs button{font:900 14px var(--body);border:2px solid var(--cream);background:transparent;color:var(--cream);border-radius:999px;padding:6px 14px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--cream);color:var(--board)}
.rlist{list-style:none;margin:12px 0 0;padding:0;max-height:min(54vh,440px);overflow-y:auto;text-align:left;border-top:2px solid rgba(246,240,220,.5)}
.rlist li{display:grid;grid-template-columns:28px minmax(0,1fr) auto 34px;gap:8px;align-items:center;padding:7px 2px;border-bottom:1px solid rgba(246,240,220,.2)}
.rlist li.mine{grid-template-columns:minmax(0,1fr) auto 34px 34px}
.rlist .no{font-family:var(--disp);font-size:16px;text-align:center;color:var(--gold)}
.rlist .nm{font-weight:900;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rlist .nm small{display:block;font-weight:700;font-size:11px;opacity:.7;letter-spacing:.06em}
.rlist .sc{text-align:right;font-size:11px;font-weight:700;line-height:1.25;white-space:nowrap}
.rlist .sc b{font-family:var(--disp);font-weight:400;font-size:17px;color:var(--gold)}
.rlist .pl,.rlist .dl{width:32px;height:32px;border-radius:50%;border:0;background:var(--magic);color:#fff;font-size:12px;cursor:pointer}
.rlist .dl{background:transparent;border:1.5px solid rgba(246,240,220,.5);color:var(--cream);font-size:14px}
.rempty{padding:18px 0;font-weight:700;text-align:center;display:block!important}
#loading{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;color:var(--board);background:#9fc4dd}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .4s}
#spdRow{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 74px);display:flex;align-items:center;gap:6px;background:rgba(15,46,36,.88);color:var(--cream);font-weight:900;font-size:13px;padding:4px 10px 4px 12px;border-radius:999px;white-space:nowrap}
#spdRow input{width:min(46vw,190px);accent-color:var(--magic);touch-action:pan-x}
#spdRow b{font-family:var(--disp);font-weight:400;font-size:17px;color:var(--gold);min-width:2.2em;text-align:right;display:inline-block}
#intro{position:absolute;left:0;right:0;top:30%;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;text-align:center;padding:0 16px}
#intro span{font-weight:900;font-size:14px;letter-spacing:.3em;color:#fff;background:var(--magic);padding:3px 12px;border-radius:999px}
#intro b{font-family:var(--disp);font-weight:400;font-size:clamp(34px,11vw,60px);line-height:1.1;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink),0 0 30px rgba(255,63,164,.8);word-break:break-all}
#intro i{font-style:normal;font-family:var(--disp);font-size:20px;color:var(--gold);-webkit-text-stroke:1px var(--ink);paint-order:stroke fill}
.news{margin:12px 0 0;background:var(--board2);border:2px solid var(--gold);border-radius:12px;padding:8px 10px;text-align:left;font-weight:700;font-size:13px}
.news p{margin:0 0 4px;color:var(--gold);font-weight:900;font-size:12px}
.news div{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
.news div b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.news div span{white-space:nowrap;color:var(--cream)}
.stats div{min-width:0;flex:1}
#tut{word-break:auto-phrase;position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 64px);width:min(92%,420px);background:var(--magic);color:#fff;font-weight:900;font-size:15px;line-height:1.45;padding:10px 14px;border-radius:12px;box-shadow:0 4px 0 #8f1457,0 10px 24px rgba(0,0,0,.3);pointer-events:none;text-align:center;text-wrap:balance}
#pad{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;align-items:center;gap:8px;background:rgba(15,46,36,.9);color:var(--cream);font-weight:900;font-size:15px;padding:10px 16px;border-radius:999px;border:2px solid var(--gold);pointer-events:none;white-space:nowrap;max-width:94%}
#pad.hold{background:var(--gold);color:var(--ink);border-color:#fff;transform:translateX(-50%) scale(1.06)}
#pad .hand{font-size:22px;display:inline-block;animation:hand 1.1s ease-in-out infinite}
#pad.hold .hand{animation:none}
@keyframes hand{0%,100%{transform:translate(0,0)}25%{transform:translate(-8px,-4px)}75%{transform:translate(8px,-4px)}}
@media (prefers-reduced-motion:reduce){#pad .hand{animation:none}}
@media (max-width:360px){.card{padding:20px 14px 14px}}
@media (prefers-reduced-motion:reduce){#flash{transition:none}}
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>
  <canvas id="draw"></canvas>
  <div id="flash"></div>

  <div id="top" hidden>
    <button class="chip" id="backBtn" data-i="back">もどる</button>
    <button class="chip" id="helpBtn" data-i="help" hidden>遊び方</button>
    <div class="chip" id="inkBox" hidden><span data-i="ink">線ののこり</span><div id="ink"><div id="inkFill"></div></div></div>
    <div class="chip" id="batInfo" hidden><span class="nm" id="biName"></span><span class="cnt"><span data-i="triesL">のこり</span><span class="dots" id="biS"><i></i><i></i><i></i></span><span id="biN"></span></span></div>
  </div>
  <div id="msg" hidden><div id="msgBig"></div><div id="msgSub"></div></div>
  <div id="hint" hidden></div>
  <div id="tut" hidden></div>
  <button class="chip" id="tutSkip" data-i="tutSkip" hidden>練習を飛ばす</button>
  <div id="views" hidden><button data-v="ed" data-i="vBack">後ろから</button><button data-v="top" data-i="vTop">上から見る</button><button data-v="side" data-i="vSide">横から見る</button></div>
  <div id="pad" hidden><span class="hand" id="padHand">👆</span><span id="padT"></span></div>

  <div id="spdRow" hidden><span data-i="spd">球速</span><input type="range" id="spdIn" min="40" max="150" step="1" value="100" aria-label="km/h"><b id="spdV">100</b><span>km/h</span></div>
  <div id="intro" hidden><span id="introL"></span><b id="introN"></b><i id="introS"></i></div>
  <div class="bar" id="edBar" hidden>
    <button id="edClear" data-i="edClear">消す</button>
    <button id="edTest" data-i="edTest">試しげり</button>
    <button id="edReg" class="go" data-i="edReg">登録する</button>
  </div>

  <!-- タイトル -->
  <div class="overlay" id="title">
    <div class="card">
      <p class="ruby" data-i="ruby">まほうのたま ピーケー</p>
      <h1 data-ih="titleH">魔法の<span class="tama">球</span><span class="pk">PK</span></h1>
      <p class="sub" data-i="sub">線を描けば、それが魔球になる。</p>
      <div id="chalBox" hidden>
        <div class="codebox" style="background:var(--magic);color:#fff"><span data-i="chal">挑戦状がとどいています</span><b id="chalName" style="letter-spacing:0;font-size:clamp(22px,7vw,30px)"></b></div>
        <button class="big gold" id="chalGo" data-i="enter">ゴールに立つ</button>
      </div>
      <button class="big" id="goMake"><span data-i="make">魔球をける</span><small data-i="makeSub">キッカー</small></button>
      <button class="big gold" id="goCode"><span data-i="byCode">合言葉で止める</span><small data-i="byCodeSub">キーパー</small></button>
      <button class="big alt" id="goRandom" data-i="random">だれかの魔球を止める</button>
      <button class="big alt" id="goRank" data-i="rank">ランキング</button>
      <div class="news" id="myNews" hidden></div>
      <p class="note" id="titleNote"></p>
      <div class="langs" role="group" aria-label="Language"><button data-lang="ja">日本語</button><button data-lang="en">English</button><button data-lang="zh">繁中</button><button data-lang="ko">한국어</button></div>
    </div>
  </div>

  <!-- 合言葉 -->
  <div class="overlay" id="codeP" hidden>
    <div class="card">
      <h2 data-i="codeTitle">合言葉で止める</h2>
      <div class="field"><input id="codeIn" class="code" maxlength="8" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="text" placeholder="ABCD2345"></div>
      <p class="note" id="codeNote"></p>
      <button class="big gold" id="codeGo" data-i="enter">ゴールに立つ</button>
      <button class="big alt" id="codeBack" data-i="back">もどる</button>
    </div>
  </div>

  <!-- 名前をつける -->
  <div class="overlay" id="regP" hidden>
    <div class="card">
      <h2 data-i="regTitle">魔球に名前をつける</h2>
      <div class="field"><input id="nameIn" maxlength="16" autocomplete="off" data-ip="namePh" placeholder="魔球の名前（16文字まで）"></div>
      <p class="note" id="regNote"></p>
      <button class="big" id="regGo" data-i="regSend">登録</button>
      <button class="big alt" id="regBack" data-i="back">もどる</button>
    </div>
  </div>

  <!-- できた -->
  <div class="overlay" id="doneP" hidden>
    <div class="card">
      <h2 data-i="doneTitle">魔球ができた</h2>
      <p class="bname" id="doneName"></p>
      <div class="codebox"><span data-i="codeLabel">合言葉</span><b id="doneCode"></b></div>
      <p class="note" data-i="doneNote">この合言葉かリンクで、だれでもこの魔球を打てます</p>
      <button class="big x" id="doneShare" data-i="share">Xに投稿</button>
      <button class="big alt" id="doneCopy" data-i="copy">リンクをコピー</button>
      <button class="big gold" id="doneBat"><span data-i="tryBat">自分で止めてみる</span><small data-i="tryBatSub">記録されません</small></button>
      <button class="big alt" id="doneTitle" data-i="toTitle">タイトルへ</button>
    </div>
  </div>

  <!-- 打席の前 -->
  <div class="overlay" id="preP" hidden>
    <div class="card">
      <p class="chal" data-i="preFrom">魔球</p>
      <p class="bname" id="preName"></p>
      <div class="codebox" style="margin-top:10px;padding:6px 8px 8px"><span data-i="codeLabel">合言葉</span><b id="preCode" style="font-size:26px"></b></div>
      <div class="stats" id="preStats"></div>
      <p class="note" id="preNote"></p>
      <ul class="how">
        <li><b>1</b><span data-i="how1"></span></li>
        <li><b>2</b><span data-i="how2"></span></li>
        <li><b>3</b><span data-i="how3"></span></li>

function batDown(e) {
  if (mode !== 'bat') return;
  audioOn();
  const p = rayZ(e.clientX, e.clientY, KZ);
  const tx = clamp(p.x, -GW - .3, GW + .3), ty = clamp(p.y, .15, GH + .2);

function updateDemo(dt) {

  KP.dur = .2 + .085 * Math.hypot(KP.tx, KP.ty - 1.0);
  if (demoT < KP.dur + .7) keeperDive(demoT / KP.dur, Math.max(0, demoT - KP.dur));

}

function judge(S, hit, p) {
  if (S.judged) return; S.judged = true;
  const end = S.P.W[S.P.W.length - 1];
  passMark.position.set(end.x, end.y, ZP + .03); passMark.lookAt(camera.position); passMark.visible = !hit;
  let res, sub = [];
  const arrive = WINDUP + S.P.T;
  if (hit) {
    res = hit === 'hand' && S.P.v < 30 ? 'catchIt' : 'save';
    // はじく
    const side = Math.sign(p.x - keeper.G.position.x) || (Math.random() < .5 ? -1 : 1);
    if (res === 'catchIt') { S.hitV = V3(0, 1.5, 2.5); } else { S.hitV = V3(side * (3 + Math.random() * 3), 2.5 + Math.random() * 3, 6 + Math.random() * 3); if (p.y > GH - .4) S.hitV.y += 4; }
    ball.position.copy(p); S.after = 0;
    SND.save(); buzz([30, 40, 60]); flash(); SND.cheer(); shake(.35); slowMo(.7);
  } else {
    res = 'goal'; SND.ooh();
    if (!KP.on) sub.push(tr('noSwing'));
    else {
      const reach = KP.t0 + KP.dur, late = arrive - reach; // マイナス = 届く前にボールが来た
      sub.push(late < -.05 ? tr('tLate') : late > KHANG + .12 ? tr('tEarly') : tr('tJust'));
      const dx = end.x - KP.tx, dy = end.y - KP.ty;
      if (Math.hypot(dx, dy) < .45) sub.push(tr('pJust'));
      else if (Math.abs(dy) >= Math.abs(dx)) sub.push(dy > 0 ? tr('pLow') : tr('pHigh'));
      else sub.push(dx > 0 ? tr('pLeft') : tr('pRight')); // キーパーから見て +x は左
    }
  }
  BAT.result = res;
  bigMsg(tr(res), sub.join(' ／ '), res === 'goal' ? 'magic' : 'good', 1.7);
  hint('');
  if (BAT.tut === 2) return;
  if (res !== 'goal') BAT.over = 'win';
  else { BAT.goals++; if (BAT.goals >= 3) BAT.over = 'lose'; }
  batUI();
}

async function openBall(code, direct) {

  const W = b && decode(b.p);
  if (!b || !W || typeof b.n !== 'string') return { err: tr('notFound') };
  const kmh = okKmh(b.s) ? b.s : 100;
  BAT.ball = { n: b.n.slice(0, 16), u: b.u, kmh }; BAT.code = code; BAT.P = makePath(W, kmh);
  BAT.mine = b.u === myUid() || mine().some(x => x.c === code);
  BAT.practice = BAT.mine || doneList().includes(code); BAT.counted = BAT.practice;
  if (direct) { startAtBat(); return {}; }

  mode = 'pre'; resetScene(); setCam('bat'); hud(); hint('');
  $('#preName').textContent = BAT.ball.n; $('#preCode').textContent = code; $('#preStats').innerHTML = '';
  $('#preNote').textContent = BAT.mine ? tr('mineNote') : BAT.practice ? tr('doneNote2') : '';

  // サーバー側で挑戦ずみか

}

async function recordResult(code, hit) {
  try {

    for (let i = 0; i < 4; i++) {

      const A = (c && c.a || 0) + 1, H = (c && c.h || 0) + hit, Ad = (cd && cd.a || 0) + 1, Hd = (cd && cd.h || 0) + hit;
      try {
        await fbPatch('pk', { ['res/' + code + '/' + a.uid]: { h: hit, t: { '.sv': 'timestamp' } }, ['cnt/' + code]: { a: A, h: H, k: A - H, n: BAT.ball.n }, ['day/' + d + '/' + code]: { a: Ad, h: Hd, k: Ad - Hd, n: BAT.ball.n } }, a);
        markDone(code); return;
      } catch (e) { await new Promise(r => setTimeout(r, 300 + Math.random() * 500)); }
    }
  } catch (_) { }
}

  if (Date.now() - newsAt < 20000 && box.dataset.html) { box.innerHTML = box.dataset.html; box.hidden = !box.dataset.html; return; }
  newsAt = Date.now();
  try {
    const cs = await Promise.all(m.map(x => fbGet('pk/cnt/' + x.c).catch(() => null)));
    const seen = lsGet('pk_seen') || {}, rows = [];
    m.forEach((x, i) => {
      const c = cs[i]; if (!c) return; const k = (c.a || 0) - (c.h || 0), h = c.h || 0, sv = seen[x.c] || { k: 0, h: 0 };
      if (k > sv.k || h > sv.h) rows.push({ n: x.n, dk: Math.max(0, k - sv.k), dh: Math.max(0, h - sv.h) });
      seen[x.c] = { k, h };
    });
    lsSet('pk_seen', seen);
    const html = rows.length ? `<p>${esc(tr('myNewsT'))}</p>` + rows.slice(0, 5).map(r => `<div><b>${esc(r.n)}</b><span>${esc(tr('myNewsL', { k: r.dk, h: r.dh }))}</span></div>`).join('') : '';
    box.dataset.html = html; box.innerHTML = html; box.hidden = !html || mode !== 'title';
  } catch (_) { }
}
if (chalCode.length === 8) fbGet('pk/balls/' + chalCode + '/n').then(n => { if (typeof n === 'string') { chalName = n; refreshTitle(); } }).catch(() => { });
$('#chalGo').onclick = guard(async () => { const r = await openBall(chalCode); if (r.err) { $('#titleNote').className = 'note err'; $('#titleNote').textContent = r.err; } });

/* ===================== 入力 ===================== */
canvas.addEventListener('pointerdown', e => { if (mode === 'edit') edDown(e); else if (mode === 'bat') batDown(e); });
canvas.addEventListener('pointermove', e => { if (mode === 'edit') edMove(e); else if (mode === 'bat') batMove(e); });
const upH = e => { if (mode === 'edit') edUp(e); else if (mode === 'bat') batUp(e); };
canvas.addEventListener('pointerup', upH); canvas.addEventListener('pointercancel', upH);
document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
// スマホでタップしても拡大されないようにする（2回タップ・ピンチ）
let lastTouchEnd = 0;
document.addEventListener('touchend', e => { const n = Date.now(); if (n - lastTouchEnd < 350 && !e.target.closest('input,textarea')) e.preventDefault(); lastTouchEnd = n; }, { passive: false });
document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
addEventListener('resize', resize);

/* ===================== まわす ===================== */
let lastT = performance.now(), tAll = 0;
const _look = new THREE.Vector3();
let MANUAL = false;
function frame(now) {
  const dt = Math.min(.05, (now - lastT) / 1000); lastT = now;
  if (!MANUAL) stepAll(dt);
  requestAnimationFrame(frame);
}
function stepAll(dt, draw = true) {
  tAll += dt; gameT += dt; runLater(); introAnim(dt);
  if (hintT > 0) { hintT -= dt; if (hintT <= 0 && mode === 'edit' && !ED.drawing) hint(ED.P ? tr('edDrawn') : tr('edHint'), false, true); }
  if (msgT > 0) { msgT -= dt; if (msgT <= 0) $('#msg').hidden = true; }
  if (mode === 'title' || mode === 'done') {
    const a = tAll * .07; camera.position.set(Math.sin(a) * 20, 8, -5 - Math.cos(a) * 20); camera.lookAt(0, 1.2, -6);
  }
  if (PITCH) updatePitch(dt * SLOW.k);
  stepFx(dt);

  if (mode === 'bat') updateSwing(dt);
  updatePad();
  if (mode === 'edit') redrawStroke();
  if (ball.visible && camMode === 'bat') { // キーパーから：遠くでは大きく光らせる
    const dc = camera.position.distanceTo(ball.position);
    ballScale = clamp(dc / 7, 1, 2.2); ball.userData.halo.material.opacity = clamp((dc - 6) / 10, 0, 1) * .22;
  } else { ballScale = 1; ball.userData.halo.material.opacity = .16; }
  if (ball.visible) { ball.userData.glow.material.opacity = (PITCH && PITCH.released ? .4 : .18) + Math.sin(tAll * 20) * .1; ball.scale.setScalar(ballScale); }
  ballShadow.visible = ball.visible && ball.position.y < 12; if (ballShadow.visible) { ballShadow.position.set(ball.position.x, .012, ball.position.z); ballShadow.scale.setScalar(clamp(1.3 - ball.position.y * .2, .4, 1.3)); }
  // ゆれ（カメラ）
  let sx = 0, sy = 0; if (SHAKE.a > .001) { SHAKE.a *= Math.exp(-dt * 7); sx = (Math.random() - .5) * SHAKE.a; sy = (Math.random() - .5) * SHAKE.a; camera.position.x += sx; camera.position.y += sy; camera.updateMatrixWorld(); }
  if (draw) renderer.render(scene, camera);
  if (sx || sy) { camera.position.x -= sx; camera.position.y -= sy; camera.updateMatrixWorld(); }
}
// 演出：看板が流れる・スマホのライト・網のゆれ・スロー
const SHAKE = { a: 0 }, SLOW = { k: 1, t: 0 };
function shake(a) { SHAKE.a = Math.max(SHAKE.a, a); }
function slowMo(t) { SLOW.t = t; }
function netHit(p, v) { if (NET_BACK) NET_BACK.hit = { x: p.x, y: p.y, t: 0, a: clamp(v / 30, .3, 1.1) }; }
let fxT = 0;
function stepFx(dt) {
  if (AD_TEX) AD_TEX.offset.x = (AD_TEX.offset.x + dt * .06) % 1;
  if (SLOW.t > 0) { SLOW.t -= dt; SLOW.k = SLOW.t > .15 ? .3 : lerp(1, .3, SLOW.t / .15); } else SLOW.k = 1;
  fxT += dt;
  if (FLASH && fxT > .08) { fxT = 0; const c = FLASH.geometry.attributes.color; for (let i = 0; i < c.count; i++) { const on = Math.random() < (SHAKE.a > .02 ? .5 : .12); c.setXYZ(i, on ? 1 : 0, on ? .97 : 0, on ? .9 : 0); } c.needsUpdate = true; }
  const N = NET_BACK; if (N && N.hit) {
    const h = N.hit; h.t += dt; const pos = N.m.geometry.attributes.position, b = N.base, gx = N.m.position.x, gy = N.m.position.y;
    const k = Math.exp(-h.t * 3.2) * Math.cos(h.t * 16) * h.a;
    for (let i = 0; i < pos.count; i++) { const x = b[i * 3] + gx, y = b[i * 3 + 1] + gy, d2 = (x - h.x) ** 2 + (y - h.y) ** 2; pos.setZ(i, b[i * 3 + 2] - .9 * k * Math.exp(-d2 / .9)); }
    pos.needsUpdate = true; if (h.t > 2) { N.hit = null; pos.array.set(b); pos.needsUpdate = true; }
  }
}

/* ===================== 始める ===================== */
resize();
applyLang(); refreshTitle(); setCam('title');
$('#loading').remove();
// ?draft= ：軌道・球速・名前が入った魔球を読みこんで、作る画面で開く（登録を押すだけにする）
(() => {
  const d = QS.get('draft'); if (!d) return;
  try {
    const j = JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(d.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0))));
    const W = decode(j.p); if (!W) return;
    edEnter(false);
    ED.kmh = okKmh(j.s) ? j.s : 100; ED.W = W; ED.P = makePath(W, ED.kmh); ED.draftName = typeof j.n === 'string' ? j.n.slice(0, 16) : '';
    setView('ed');
  } catch (_) { }
})();
requestAnimationFrame(frame);
// テスト用
window.__mt = {
  get mode() { return mode; }, ED, BAT, toWorld, len3, inZone, encode, decode, toScreen, R0, ZP, CAP, makePath,
  get pitch() { return PITCH; }, openBall, startAtBat, cleanCode, badName,
  keeper, KP, keeperHit, batDown, GW, GH, ZX, ZB, ZT,
  setStroke(pts) { edEnter(false); ED.pts = pts; ED.drawing = true; edPid = 1; edUp({ pointerId: 1 }); return !!ED.P; },
  manual(on) { MANUAL = on; }, tick(dt, draw = true) { stepAll(dt, draw); }, run(n, dt = 1 / 30) { for (let i = 0; i < n; i++) stepAll(dt, i === n - 1); }, get time() { return gameT; }, SND, startPick, setView, startTest, pickAt, setCam, edEnter,
};
